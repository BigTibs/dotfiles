# ============================================================================
# TMUX CONFIGURATION (Don't forget to prefix + I to install plugins the first 
# time you open tmux. Also, don't forget to clone the tpm github repo)
# ============================================================================

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------
set -g prefix ^A                    # Set prefix to Ctrl+A
set -g base-index 1                 # Start indexing windows at 1 instead of 0
set -g renumber-windows on          # Renumber all windows when any window is closed
set -g history-limit 1000000        # Increase history limit
set -g escape-time 0                # Zero-out escape time delay (better for vim/nvim)
set -g focus-events on              # Report when a pane/terminal gains or loses focus
set -g allow-passthrough on         # Allow passthrough sequences
set -g mode-keys vi                 # Use vi key bindings in copy mode

# ----------------------------------------------------------------------------
# Display & Terminal
# ----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g set-clipboard on             # Use system clipboard

# ----------------------------------------------------------------------------
# Status Bar Configuration
# ----------------------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-left-length 100

# ----------------------------------------------------------------------------
# Color Palette
# ----------------------------------------------------------------------------
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#A29884"

# ----------------------------------------------------------------------------
# Styling
# ----------------------------------------------------------------------------
# Status bar
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${cyan_soft},bold] #S #[fg=${gray_light},nobold]"

# Window status
set -g window-status-format " #I:#W"
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W"
set -g window-status-current-style "fg=blue,bg=default,bold"

# Messages and modes
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"

# Panes
set -g pane-active-border-style "fg=${gray_medium}"

# ----------------------------------------------------------------------------
# Hooks (Force status bar visibility)
# ----------------------------------------------------------------------------
set-hook -g client-attached 'refresh-client -S'
set-hook -g client-detached 'refresh-client -S'
set-hook -g session-window-changed 'refresh-client -S'

# ----------------------------------------------------------------------------
# Key Bindings
# ----------------------------------------------------------------------------

# Reload configuration
bind r source-file "~/.config/tmux/tmux.conf"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Kill pane/window without confirmation
unbind &
bind & kill-window

unbind x
bind x kill-pane

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin configurations
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# ----------------------------------------------------------------------------
# Initialize TPM (keep this at the very bottom)
# ----------------------------------------------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'

