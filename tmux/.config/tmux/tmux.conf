# ============================================================================
# TMUX CONFIGURATION (Don't forget to prefix + I to install plugins the first 
# time you open tmux. Also, don't forget to clone the tpm github repo)
# ============================================================================

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------
set -g prefix ^A                    # Set prefix to Ctrl+A
set -g base-index 1                 # Start indexing windows at 1 instead of 0
set -g renumber-windows on          # Renumber all windows when any window is closed
set -g history-limit 1000000        # Increase history limit
set -g escape-time 0                # Zero-out escape time delay (better for vim/nvim)
set -g focus-events on              # Report when a pane/terminal gains or loses focus
set -g allow-passthrough on         # Allow passthrough sequences
set -g mode-keys vi                 # Use vi key bindings in copy mode

# ----------------------------------------------------------------------------
# Display & Terminal
# ----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g set-clipboard on             # Use system clipboard

# ----------------------------------------------------------------------------
# Status Bar Configuration
# ----------------------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-left-length 100

# ----------------------------------------------------------------------------
# Color Palette
# ----------------------------------------------------------------------------
# gray_light="#D8DEE9"
# gray_medium="#ABB2BF"
# gray_dark="#3B4252"
# green_soft="#A3BE8C"
# blue_muted="#81A1C1"
# cyan_soft="#A29884"
# LACKLUSTER THEME BEGIN
color_lack="#708090"
color_luster="#deeeed"
color_orange="#ffaa88"
color_green="#789978"
color_blue="#7788AA"
color_red="#D70000"
color_black="#000000"
color_gray1="#080808"
color_gray2="#191919"
color_gray3="#2a2a2a"
color_gray4="#444444"
color_gray5="#555555"
color_gray6="#7a7a7a"
color_gray7="#aaaaaa"
color_gray8="#cccccc"
color_gray9="#DDDDDD"

# ----------------------------------------------------------------------------
# Styling
# ----------------------------------------------------------------------------
# Status bar

# set -g status-style "fg=${gray_light},bg=default"
# set -g status-left "#[fg=${cyan_soft},bold] #S #[fg=${gray_light},nobold]"
#
# # Window status
# set -g window-status-format " #I:#W"
# set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W"
# set -g window-status-current-style "fg=blue,bg=default,bold"
#
# # Messages and modes
# set -g message-style "fg=${gray_light},bg=default"
# set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
#
# # Panes
# set -g pane-active-border-style "fg=${gray_medium}"

set-option -g automatic-rename              on
set-option -g automatic-rename-format       "#I"
set-option -g status-fg                     "$color_luster"
set-option -g status-bg                     "$color_gray2"
set-option -g copy-mode-current-match-style "fg=$color_gray1,bg=$color_gray8"
set-option -g copy-mode-match-style         "fg=$color_gray1,bg=$color_gray8"
set-option -g menu-selected-style           "fg=$color_gray1,bg=$color_luster"
set-option -g menu-style                    "fg=$color_luster,bg=$color_gray1"
set-option -g message-style                 "bg=$color_gray6,fg=$color_gray1" # command in vi-insert mode
set-option -g message-command-style         "bg=$color_gray6,fg=$color_gray4" # command in vi-normal mode
set-option -g mode-style                    "bg=$color_gray8,fg=$color_gray1"
set-option -g pane-active-border-style      "fg=$color_gray1"
set-option -g pane-border-lines             "heavy"
set-option -g pane-border-style             "fg=$color_gray1"
set-option -g pane-border-style             "fg=$color_gray5"
set-option -g popup-border-lines            "rounded"
set-option -g status-right-style            "fg=$color_gray6"
set-option -g window-status-current-style   "fg=$color_gray8"
set-option -g window-status-style           "fg=$color_gray6"
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set-option -g window-status-format         '#{?#{==:#W,},#I,#I:#W}'
set-option -g window-status-current-format '#{?#{==:#W,},#I,#I:#W}'

set-option -g clock-mode-colour             "$color_gray6"
set-option -g status-right                 ' #{?#{>:#{server_sessions},1},(#{session_name}),} #(date +"%H:%M") '
set-option -g status-left                  ' '

# ----------------------------------------------------------------------------
# Hooks (Force status bar visibility)
# ----------------------------------------------------------------------------
set-hook -g client-attached 'refresh-client -S'
set-hook -g client-detached 'refresh-client -S'
set-hook -g session-window-changed 'refresh-client -S'

# ----------------------------------------------------------------------------
# Key Bindings
# ----------------------------------------------------------------------------

# Reload configuration
bind r source-file "~/.config/tmux/tmux.conf"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Kill pane/window without confirmation
unbind &
bind & kill-window

unbind x
bind x kill-pane

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin configurations
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# ----------------------------------------------------------------------------
# Initialize TPM (keep this at the very bottom)
# ----------------------------------------------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'

