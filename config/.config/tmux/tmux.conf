# ============================================================================
# TMUX CONFIGURATION
# Minimal earthy theme — charcoal, olive-grey and warm amber
# ============================================================================

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 1000000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g mode-keys vi

set -g automatic-rename on
set -g automatic-rename-format "#I"

# ----------------------------------------------------------------------------
# Terminal
# ----------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g set-clipboard on

# ----------------------------------------------------------------------------
# Color Palette
# ----------------------------------------------------------------------------

# Base
thm_black="#0f0f0f"
thm_bg="#131414"
thm_bg_alt="#1D1F1E"
thm_surface="#272A28"

# Grey / olive
thm_border="#3A3F3C"
thm_muted="#585F5A"
thm_dim="#6B746E"
thm_grey="#878E7A"
thm_grey_light="#999C8B"

# Warm neutrals
thm_beige="#B6B69A"
thm_text="#D8CCB4"
thm_text_bright="#E3DAC9"
thm_white="#F9EEE5"

# Accents
thm_amber="#efbe71"
thm_orange="#ef944d"

# ----------------------------------------------------------------------------
# Status Bar
# ----------------------------------------------------------------------------

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style "fg=${thm_dim},bg=${thm_black}"
set -g status-left-length 40
set -g status-right-length 60

# Left: Session name
set -g status-left "#[fg=${thm_orange},bold] #S #[fg=${thm_muted}]│ "

# Right: Minimal information
set -g status-right "#[fg=${thm_muted}]#{?client_prefix, PREFIX │,}#{?pane_in_mode, COPY │,}"

# Window list
set -g window-status-format "#[fg=${thm_dim}] #I:#W "
set -g window-status-current-format "#[fg=${thm_orange},bold] #I:#W #[fg=${thm_muted}]"

set -g window-status-separator ""

set -g window-status-style "fg=${thm_dim},bg=${thm_black}"
set -g window-status-current-style "fg=${thm_orange},bg=${thm_black},bold"

# Activity and alerts
set -g monitor-activity off
set -g visual-activity off
set -g bell-action none

# ----------------------------------------------------------------------------
# Pane Borders
# ----------------------------------------------------------------------------

set -g pane-border-lines single
set -g pane-border-style "fg=${thm_border}"
set -g pane-active-border-style "fg=${thm_orange}"

# ----------------------------------------------------------------------------
# Messages, Menus & Copy Mode
# ----------------------------------------------------------------------------

set -g message-style "fg=${thm_black},bg=${thm_amber}"
set -g message-command-style "fg=${thm_text},bg=${thm_surface}"

set -g mode-style "fg=${thm_black},bg=${thm_beige}"

set -g copy-mode-match-style "fg=${thm_black},bg=${thm_amber}"
set -g copy-mode-current-match-style "fg=${thm_black},bg=${thm_orange}"

set -g menu-style "fg=${thm_text},bg=${thm_bg_alt}"
set -g menu-selected-style "fg=${thm_black},bg=${thm_amber}"

set -g clock-mode-colour "${thm_amber}"
set -g clock-mode-style 24

# ----------------------------------------------------------------------------
# Key Bindings
# ----------------------------------------------------------------------------

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind t set-option -g status 

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Kill pane/window without confirmation
unbind &
bind & kill-window

unbind x
bind x kill-pane

